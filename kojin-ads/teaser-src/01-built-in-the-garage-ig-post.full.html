<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}
body{background:#181819;color:#f2e9d7;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.pg{position:relative;overflow:hidden;background:#181819}
.mono{font-family:"IBM Plex Mono",monospace;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.kick{font-family:"IBM Plex Mono",monospace;font-weight:700;letter-spacing:.16em;font-size:26px;display:flex;align-items:center;gap:16px}
.kick i{display:inline-block;width:40px;height:13px;background:#f55738;transform:skewX(-24deg)}
.wm{font-weight:800;font-style:italic;letter-spacing:-.045em;font-size:40px;color:#f2e9d7}
h1{font-weight:900;letter-spacing:-.065em;line-height:.9;color:#f2e9d7}

.intro{color:#dfd5c6;font-weight:400;line-height:1.4}
.btn{display:inline-flex;align-items:center;gap:16px;padding:22px 30px;font-weight:800;font-size:30px;border:2px solid #f55738;background:#f55738;color:#171717;letter-spacing:-.01em}
.btn.q{background:transparent;color:#f2e9d7;border-color:#70665d}
.track{position:absolute;left:0;right:0;bottom:0;background:#f55738;color:#171717;display:flex;justify-content:space-evenly;padding:24px 20px;font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:22px;letter-spacing:.14em}
.card{background:#232325;border:2px solid #48413d}
.card .im{background:#fff center/cover no-repeat}
.card .info{display:flex;justify-content:space-between;align-items:baseline;padding:18px 20px}
.card .info b{white-space:nowrap;font-weight:700;font-size:23px;letter-spacing:-.025em}
.card .info span{font-family:"IBM Plex Mono",monospace;font-weight:700;color:#ff836e;font-size:24px}
.corner{position:absolute;width:34px;height:34px;border-color:rgba(242,233,215,.7);border-style:solid;border-width:0}
